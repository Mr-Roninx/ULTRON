version: '3.8'

services:
  # --- PostgreSQL 15+ Enterprise Relational Core ---
  postgres:
    image: postgres:15-alpine
    container_name: ultron-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ultron
      POSTGRES_PASSWORD: ultron_secure_password
      POSTGRES_DB: ultron_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ultron -d ultron_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ultron-net

  # --- Redis 7+ Distributed Message & Cache Layer ---
  redis:
    image: redis:7-alpine
    container_name: ultron-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ultron-net

  # --- ULTRON Autonomous Control Plane Daemon ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ultron-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://ultron:ultron_secure_password@postgres:5432/ultron_db
      DATABASE_POOL_SIZE: 15
      REDIS_URL: redis://redis:6379
      NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      LLM_MODEL: nvidia/nemotron-3.5-lightning-30b-a3b
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ultron-net

  # --- ULTRON Single-Page Management Dashboard ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ultron-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - ultron-net

  # --- NGINX Reverse Proxy & Edge Rate Limiter ---
  nginx:
    image: nginx:alpine
    container_name: ultron-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - ultron-net

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local

networks:
  ultron-net:
    driver: bridge
